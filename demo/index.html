<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tetris</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #1a1a1a;
            --text-color: #00f2ff;
            --accent-color: #ff00ff;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        #game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--panel-color);
            border: 4px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            position: relative;
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #000;
        }

        #side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 150px;
        }

        .stat-box {
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--text-color);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }

        #overlay h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-color);
        }

        button {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--text-color);
            color: #000;
            box-shadow: 0 0 15px var(--text-color);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>
        
        <div id="side-panel">
            <div class="stat-box">
                <div class="stat-label">Next</div>
                <canvas id="next" width="100" height="100"></canvas>
            </div>
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Lines</div>
                <div id="lines" class="stat-value">0</div>
            </div>
            <div class="controls-hint">
                ← → : Move<br>
                ↑ : Rotate<br>
                ↓ : Soft Drop<br>
                Space : Hard Drop
            </div>
        </div>

        <div id="overlay">
            <h2 id="overlay-text">Neon Tetris</h2>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const linesElement = document.getElementById('lines');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlay-text');
        const startBtn = document.getElementById('start-btn');

        context.scale(24, 24);
        nextContext.scale(20, 20);

        const COLORS = [
            null,
            '#00f2ff', // I
            '#0044ff', // J
            '#ffaa00', // L
            '#ffff00', // O
            '#00ff00', // S
            '#aa00ff', // T
            '#ff0000', // Z
        ];

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = COLORS[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        // Adding a subtle inner border for the neon block look
                        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 0.05;
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function drawNext() {
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            const matrix = player.next;
            // Center the next piece in the preview canvas
            const offX = (5 - matrix[0].length) / 2;
            const offY = (5 - matrix.length) / 2;
            drawMatrix(matrix, {x: offX, y: offY}, nextContext);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                player.lines += 1;
                rowCount *= 2;
            }
            updateScore();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            if (player.next === null) {
                player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            } else {
                player.matrix = player.next;
            }
            player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                gameOver();
            }
            drawNext();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            if (paused) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            linesElement.innerText = player.lines;
            // Increase speed slightly as score grows
            dropInterval = Math.max(100, 1000 - (player.lines * 20));
        }

        function gameOver() {
            paused = true;
            overlayText.innerText = 'GAME OVER';
            startBtn.innerText = 'Try Again';
            overlay.style.display = 'flex';
        }

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
            lines: 0,
        };

        let paused = true;

        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.next = null;
            updateScore();
            playerReset();
            paused = false;
            overlay.style.display = 'none';
            update();
        }

        document.addEventListener('keydown', event => {
            if (paused) return;

            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 38) {
                playerRotate(1);
            } else if (event.keyCode === 32) {
                playerHardDrop();
            }
        });

        startBtn.addEventListener('click', startGame);

        // --- Internal Test Suite ---
        window.runTests = function() {
            console.log('🚀 Running Tetris Logic Tests...');
            let passed = 0;
            let total = 0;

            function assert(condition, message) {
                total++;
                if (condition) {
                    console.log('✅ PASS: ' + message);
                    passed++;
                } else {
                    console.error('❌ FAIL: ' + message);
                }
            }

            // Test 1: Piece Creation
            const iPiece = createPiece('I');
            assert(iPiece.length === 4 && iPiece[0].length === 4, 'I-piece should be 4x4');

            // Test 2: Rotation logic (Simple rotate)
            const testMatrix = [[1, 0], [0, 0]];
            rotate(testMatrix, 1); // Rotate clockwise
            // Original: [1, 0] -> [0, 0]
            //         [0, 0]    [0, 0]
            // Rotated:  [0, 0]
            //          [1, 0]
            assert(testMatrix[1][0] === 1 && testMatrix[0][0] === 0, 'Basic rotation should move top-left to bottom-left');

            // Test 3: Collision Detection
            const mockArena = createMatrix(10, 20);
            mockArena[19][5] = 1; // Set a block at the bottom
            const mockPlayer = {
                pos: {x: 5, y: 18},
                matrix: [[1]]
            };
            assert(collide(mockArena, mockPlayer) === true, 'Should collide when piece is on top of another block');
            
            mockPlayer.pos.y = 17;
            assert(collide(mockArena, mockPlayer) === false, 'Should not collide when piece is above another block');

            // Test 4: Line Clearing Logic (Simplified simulation)
            const lineArena = createMatrix(10, 20);
            lineArena[19] = new Array(10).fill(1); // Fill bottom row
            const playerMock = { score: 0, lines: 0 };
            
            // We simulate the arenaSweep logic manually since it's a global function
            // Note: arenaSweep uses global 'arena' and 'player'
            // For testing, we'd need to temporarily swap globals or refactor
            console.log('⚠️ Line clear test requires global state swap. Skipping automated logic and testing manually via gameplay.');

            console.log(`\\nTests complete: ${passed}/${total} passed.`);
            return passed === total;
        };

        console.log('Game loaded. Call runTests() in the console to verify logic.');
    </script>
</body>
</html>
